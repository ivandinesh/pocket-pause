name: Build and browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: release-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: python3 scripts/check_secrets.py
      - run: npm ci --ignore-scripts --prefix tooling
      - run: npx --prefix tooling playwright install --with-deps chromium
      - run: python3 scripts/build.py
      - name: Browser checks
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tooling/node_modules/playwright
        run: |
          python3 scripts/preview.py > /tmp/dopop-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_home_footer_browser.cjs
          node scripts/test_responsive_state.cjs
          node scripts/test_security_browser.cjs
          node scripts/test_responsive_browser.cjs
