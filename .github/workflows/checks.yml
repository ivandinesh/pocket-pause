name: Build and browser checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: release-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: python3 scripts/check_secrets.py
      - run: npm ci --ignore-scripts --prefix tooling
      - run: google-chrome --version
      - run: python3 scripts/build.py
      - name: Browser checks
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tooling/node_modules/playwright
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          python3 scripts/preview.py > /tmp/dopop-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test_home_footer_browser.cjs
          node scripts/test_responsive_state.cjs
          node scripts/test_security_browser.cjs
          node scripts/test_responsive_browser.cjs
