name: Apply Words compact top

on:
  push:
    paths:
      - 'scripts/patch_words_compact_top.py'
      - '.github/workflows/run-words-compact-top.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Words layout
        run: python3 scripts/patch_words_compact_top.py
      - name: Validate
        run: |
          grep -q "content-height answers with flexible spacer" index.html
          grep -q "#wordsPage .word-targets{flex:0 0 auto" index.html
          grep -q "#wordsPage .word-status{margin-top:auto" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Keep Words answers compact at top"
          git push
