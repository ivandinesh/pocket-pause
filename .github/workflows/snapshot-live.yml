name: Snapshot current production

on:
  push:
    paths:
      - '.github/workflows/snapshot-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current production app
        run: |
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            'https://pocket-pause-ebon.vercel.app/?github_snapshot=1' \
            -o index.html
          test -s index.html
      - name: Commit exact production snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Snapshot current Pocket Pause production [skip ci]'
          git push
