name: Apply Sudoku popup toggle

on:
  push:
    paths:
      - 'scripts/patch_sudoku_toggle_pad.py'
      - '.github/workflows/run-sudoku-toggle-pad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sudoku popup toggle
        run: python3 scripts/patch_sudoku_toggle_pad.py
      - name: Validate
        run: |
          grep -Fq "sameCell=sudoku.selected===i" index.html
          grep -Fq "if(sameCell&&padOpen)closeSudokuPad();else positionSudokuPad(i)" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Toggle Sudoku popup on repeated cell tap"
          git push
