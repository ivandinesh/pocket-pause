name: Apply dynamic Words answers

on:
  push:
    paths:
      - 'scripts/patch_words_dynamic_answers.py'
      - '.github/workflows/run-words-dynamic-answers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Words answer spacing
        run: python3 scripts/patch_words_dynamic_answers.py
      - name: Validate expected changes
        run: |
          grep -q "margin-top:auto" index.html
          grep -q "--target-count" index.html
          grep -q "--wheel:min(365px,39dvh" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Words answer area content-sized"
          git push
