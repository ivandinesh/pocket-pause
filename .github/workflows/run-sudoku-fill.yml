name: Apply Sudoku full-height layout

on:
  push:
    paths:
      - 'scripts/patch_sudoku_fill.py'
      - '.github/workflows/run-sudoku-fill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sudoku layout
        run: python3 scripts/patch_sudoku_fill.py
      - name: Validate
        run: |
          grep -q "Sudoku: use vertical space without over-stretching" index.html
          grep -q "grid-template-rows:repeat(9,1fr)" index.html
          grep -q "max-height:min(calc((100vw - 16px)*1.18),calc(100dvh - 225px))" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use full vertical space for Sudoku"
          git push
