name: Apply Words labels

on:
  push:
    paths:
      - 'scripts/patch_words_labels.py'
      - '.github/workflows/run-words-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Words labels
        run: python3 scripts/patch_words_labels.py
      - name: Validate
        run: |
          grep -q "larger bonus and hint labels" index.html
          grep -q "#bonusCount{font-size:15px" index.html
          grep -q ".round-tool.hint small{font-size:12px" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enlarge Words bonus and hint labels"
          git push
