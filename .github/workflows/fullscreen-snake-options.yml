name: Fullscreen Snake options

on:
  push:
    paths:
      - '.github/workflows/fullscreen-snake-options.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Snake only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_css="""/* Snake-only responsive full-device playfield */
#snakePage.active{display:flex;flex-direction:column;max-width:none;width:100%;height:calc(100dvh - 72px);min-height:0;padding:8px 0 max(0px,env(safe-area-inset-bottom));overflow:hidden}
#snakePage .game-heading{flex:0 0 auto;width:min(820px,100%);margin:0 auto 8px;padding:0 18px}
#snakePage .canvas-shell{flex:1 1 auto;width:100%;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none;background:#fff}
#snakePage .canvas-shell canvas{width:100%;height:100%}
@media(max-width:760px){#snakePage.active{height:calc(100dvh - 64px);padding-top:4px}#snakePage .game-heading{margin-bottom:4px;padding:0 14px}#snakePage .canvas-shell{height:auto;min-height:0;border-radius:0}}
@media(orientation:landscape) and (max-height:600px){#snakePage .game-heading{margin-bottom:2px}#snakePage .game-heading .eyebrow{display:none}#snakePage .game-heading h1{font-size:22px}}
"""
          new_css="""/* Snake-only true full-screen playfield */
body:has(#snakePage.active) .topbar{display:none}
body:has(#snakePage.active) #app{min-height:100dvh}
#snakePage.active{display:flex;flex-direction:column;max-width:none;width:100%;height:100dvh;min-height:0;padding:max(10px,env(safe-area-inset-top)) 0 max(0px,env(safe-area-inset-bottom));overflow:hidden;background:#fff}
#snakePage .game-heading{flex:0 0 auto;width:100%;margin:0;padding:4px 18px 6px;grid-template-columns:44px minmax(0,1fr) auto;gap:12px}
#snakePage .snake-label-row{display:flex;align-items:center;gap:9px;min-height:22px}
#snakePage .snake-label-row .eyebrow{margin:0}
#snakePage .snake-sound{width:30px;height:30px;border:0;background:#f3f6fc;border-radius:50%;display:grid;place-items:center;font-size:14px;cursor:pointer;padding:0}
#snakePage .heading-stat{min-width:56px}
#snakePage .snake-options{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 16px 8px;min-height:42px}
#snakePage .snake-palette,#snakePage .snake-shapes{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid #e8edf7;border-radius:999px;background:#fff}
#snakePage .snake-color{width:26px;height:26px;border:0;border-radius:50%;padding:4px;background:transparent;cursor:pointer;position:relative}
#snakePage .snake-color:before{content:'';display:block;width:18px;height:18px;border-radius:50%;background:var(--swatch)}
#snakePage .snake-color[aria-pressed='true']{box-shadow:0 0 0 2px #cdd9f6 inset}
#snakePage .snake-shape{height:28px;min-width:52px;border:0;border-radius:999px;background:transparent;color:#7d879b;font-size:11px;font-weight:700;padding:0 9px;cursor:pointer}
#snakePage .snake-shape[aria-pressed='true']{background:#eef3ff;color:#3568ee}
#snakePage .canvas-shell{flex:1 1 auto;width:100%;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none;background:#fff}
#snakePage .canvas-shell canvas{width:100%;height:100%}
@media(max-width:760px){#snakePage.active{height:100dvh;padding-top:max(6px,env(safe-area-inset-top))}#snakePage .game-heading{padding:2px 12px 4px;margin:0}#snakePage .game-heading h1{font-size:26px}#snakePage .snake-options{padding-bottom:6px;gap:8px}#snakePage .snake-palette,#snakePage .snake-shapes{gap:4px;padding:3px 5px}#snakePage .snake-color{width:24px;height:24px}#snakePage .snake-color:before{width:16px;height:16px}#snakePage .snake-shape{min-width:46px;height:26px;padding:0 7px}}
@media(orientation:landscape) and (max-height:600px){#snakePage .game-heading{padding-bottom:2px}#snakePage .game-heading h1{font-size:21px}#snakePage .snake-options{padding:0 12px 3px;min-height:32px}}
"""
          if old_css not in s: raise SystemExit('Snake CSS block not found')
          s=s.replace(old_css,new_css,1)

          old_heading='''        <div><p class="eyebrow">SNAKE</p><h1>One more dot.</h1></div>\n        <div class="heading-stat"><b id="snakeScore">0</b><span>score</span></div>\n      </div>\n      <div class="canvas-shell"><canvas id="snakeCanvas"></canvas>'''
          new_heading='''        <div><div class="snake-label-row"><p class="eyebrow">SNAKE</p><button id="snakeSoundButton" class="snake-sound" aria-label="Toggle sound">♪</button></div><h1>One more dot.</h1></div>\n        <div class="heading-stat"><b id="snakeScore">0</b><span>score</span></div>\n      </div>\n      <div class="snake-options" aria-label="Snake appearance">\n        <div class="snake-palette" aria-label="Snake color">\n          <button class="snake-color" data-snake-color="blue" style="--swatch:#4f78ec" aria-label="Blue" aria-pressed="true"></button>\n          <button class="snake-color" data-snake-color="green" style="--swatch:#3e9b70" aria-label="Green" aria-pressed="false"></button>\n          <button class="snake-color" data-snake-color="amber" style="--swatch:#d8942f" aria-label="Amber" aria-pressed="false"></button>\n          <button class="snake-color" data-snake-color="graphite" style="--swatch:#596171" aria-label="Graphite" aria-pressed="false"></button>\n        </div>\n        <div class="snake-shapes" aria-label="Snake shape">\n          <button class="snake-shape" data-snake-shape="round" aria-pressed="true">● Round</button>\n          <button class="snake-shape" data-snake-shape="square" aria-pressed="false">■ Nokia</button>\n        </div>\n      </div>\n      <div class="canvas-shell"><canvas id="snakeCanvas"></canvas>'''
          if old_heading not in s: raise SystemExit('Snake heading block not found')
          s=s.replace(old_heading,new_heading,1)

          old_sound="""$('soundButton').textContent=sound?'♫':'♪';$('soundButton').addEventListener('click',()=>{sound=!sound;storage.set('sound',sound);$('soundButton').textContent=sound?'♫':'♪';beep()});"""
          new_sound="""function syncSoundButtons(){$('soundButton').textContent=sound?'♫':'♪';const sb=$('snakeSoundButton');if(sb)sb.textContent=sound?'♫':'♪'}\nsyncSoundButtons();$('soundButton').addEventListener('click',()=>{sound=!sound;storage.set('sound',sound);syncSoundButtons();beep()});$('snakeSoundButton').addEventListener('click',()=>{sound=!sound;storage.set('sound',sound);syncSoundButtons();beep()});"""
          if old_sound not in s: raise SystemExit('Sound block not found')
          s=s.replace(old_sound,new_sound,1)

          old_start="""const snake=new SnakeGame();const sc=$('snakeCanvas'),sctx=sc.getContext('2d');let sW=0,sH=0,sDpr=1,sLast=0,sGesture=null;"""
          new_start="""const snake=new SnakeGame();const sc=$('snakeCanvas'),sctx=sc.getContext('2d');let sW=0,sH=0,sDpr=1,sLast=0,sGesture=null;\nconst SNAKE_COLORS={blue:{head:'#2f62e8',body:'#4f78ec',food:'#7696ef'},green:{head:'#26845c',body:'#3e9b70',food:'#75c5a2'},amber:{head:'#c17b18',body:'#d8942f',food:'#efbb69'},graphite:{head:'#3f4652',body:'#596171',food:'#9299a5'}};\nlet snakeColor=storage.get('snake.color','blue'),snakeShape=storage.get('snake.shape','round'),snakeBooster=null,snakeEffect=null,snakeNextBoosterAt=0;\nif(!SNAKE_COLORS[snakeColor])snakeColor='blue';if(!['round','square'].includes(snakeShape))snakeShape='round';\nfunction snakePalette(){return SNAKE_COLORS[snakeColor]}\nfunction snakeSizeFactor(t=performance.now()){return snakeEffect&&snakeEffect.type==='small'&&t<snakeEffect.until?.8:1}\nfunction snakeSpeedFactor(t=performance.now()){if(!snakeEffect||t>=snakeEffect.until)return 1;return snakeEffect.type==='fast'?1.45:snakeEffect.type==='slow'?.68:1}\nfunction snakeMark(ctx,x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;if(snakeShape==='square')ctx.fillRect(x-r,y-r,r*2,r*2);else{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.restore()}\nfunction setSnakeColor(name){if(!SNAKE_COLORS[name])return;snakeColor=name;storage.set('snake.color',name);document.querySelectorAll('[data-snake-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.snakeColor===name)))}\nfunction setSnakeShape(name){if(!['round','square'].includes(name))return;snakeShape=name;storage.set('snake.shape',name);document.querySelectorAll('[data-snake-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.snakeShape===name)))}\ndocument.querySelectorAll('[data-snake-color]').forEach(b=>b.addEventListener('click',()=>setSnakeColor(b.dataset.snakeColor)));document.querySelectorAll('[data-snake-shape]').forEach(b=>b.addEventListener('click',()=>setSnakeShape(b.dataset.snakeShape)));setSnakeColor(snakeColor);setSnakeShape(snakeShape);"""
          if old_start not in s: raise SystemExit('Snake init block not found')
          s=s.replace(old_start,new_start,1)

          old_head="""function drawSnakeHead(x,y,cell){const r=cell*.32;dot(sctx,x,y,r,'#2f62e8');const d=snake.dir,side={x:-d.y,y:d.x},forward=.075*cell,spread=.075*cell,eyeR=Math.max(1.4,cell*.034);for(const sign of [-1,1]){const ex=x+d.x*forward+side.x*spread*sign,ey=y+d.y*forward+side.y*spread*sign;dot(sctx,ex,ey,eyeR,'#fff');dot(sctx,ex+d.x*eyeR*.28,ey+d.y*eyeR*.28,eyeR*.42,'#24345b')}}"""
          new_head="""function drawSnakeHead(x,y,cell){const r=cell*.32*snakeSizeFactor(),c=snakePalette();snakeMark(sctx,x,y,r,c.head);const d=snake.dir,side={x:-d.y,y:d.x},forward=.075*cell,spread=.075*cell,eyeR=Math.max(1.35,cell*.034);for(const sign of [-1,1]){const ex=x+d.x*forward+side.x*spread*sign,ey=y+d.y*forward+side.y*spread*sign;dot(sctx,ex,ey,eyeR,'#fff');dot(sctx,ex+d.x*eyeR*.28,ey+d.y*eyeR*.28,eyeR*.42,'#24345b')}}\nfunction drawSnakeBooster(cell,ox,oy,t){if(!snakeBooster)return;const x=ox+(snakeBooster.x+.5)*cell,y=oy+(snakeBooster.y+.5)*cell,pulse=1+.12*Math.sin(t/180),colors={small:'#8f6fe8',fast:'#ef6a55',slow:'#49a9c7',bonus:'#e0ab2f'},c=colors[snakeBooster.type];dot(sctx,x,y,cell*.27*pulse,c,.22);dot(sctx,x,y,cell*.16,c,.98);dot(sctx,x,y,cell*.045,'#fff',.95)}\nfunction scheduleSnakeBooster(t=performance.now()){snakeNextBoosterAt=t+6500+Math.random()*7500}\nfunction spawnSnakeBooster(t){const used=new Set(snake.snake.map(p=>p.x+','+p.y));if(snake.food)used.add(snake.food.x+','+snake.food.y);const free=[];for(let y=0;y<snake.rows;y++)for(let x=0;x<snake.cols;x++)if(!used.has(x+','+y))free.push({x,y});if(!free.length)return scheduleSnakeBooster(t);const spot=free[Math.floor(Math.random()*free.length)],types=['small','fast','slow','bonus'];snakeBooster={...spot,type:types[Math.floor(Math.random()*types.length)],until:t+6500};scheduleSnakeBooster(t)}\nfunction collectSnakeBooster(t){if(!snakeBooster)return;const h=snake.snake[0];if(!h||h.x!==snakeBooster.x||h.y!==snakeBooster.y)return;const type=snakeBooster.type;snakeBooster=null;if(type==='bonus'){snake.score+=3;toast('Surprise +3');beep(850,.08)}else{snakeEffect={type,until:t+7000};toast(type==='small'?'Tiny mode':type==='fast'?'Speed boost':'Slow motion');beep(type==='fast'?760:type==='slow'?360:620,.07)}}\nfunction updateSnakeBoosters(t){if(snake.status!=='playing')return;if(snakeEffect&&t>=snakeEffect.until)snakeEffect=null;if(snakeBooster&&t>=snakeBooster.until)snakeBooster=null;if(!snakeBooster&&t>=snakeNextBoosterAt)spawnSnakeBooster(t);collectSnakeBooster(t)}"""
          if old_head not in s: raise SystemExit('Snake head block not found')
          s=s.replace(old_head,new_head,1)

          old_draw="""function drawSnake(){if(!sW)return;const{cell,ox,oy}=snakeGeom();sctx.clearRect(0,0,sW,sH);for(let y=0;y<snake.rows;y++)for(let x=0;x<snake.cols;x++)dot(sctx,ox+(x+.5)*cell,oy+(y+.5)*cell,Math.max(1.15,cell*.065),'#dfe6f5',.72);if(snake.food){const fx=ox+(snake.food.x+.5)*cell,fy=oy+(snake.food.y+.5)*cell;dot(sctx,fx,fy,cell*.27,'#7696ef');dot(sctx,fx,fy,cell*.07,'#fff',.92)}const a=snake.status==='playing'?Math.min(1,snake.elapsed/snake.speed()):1;const points=snake.snake.map((p,i)=>snakeRenderPoint(p,snake.prev[i]||p,a));for(let i=points.length-1;i>=1;i--){const p=points[i],fade=1-Math.min(.22,i/Math.max(1,points.length-1)*.22);dot(sctx,ox+(p.x+.5)*cell,oy+(p.y+.5)*cell,cell*.255,'#4f78ec',fade)}if(points[0])drawSnakeHead(ox+(points[0].x+.5)*cell,oy+(points[0].y+.5)*cell,cell);$('snakeScore').textContent=snake.score;if(snake.status==='over'||snake.status==='won'){const ov=$('snakeOverlay');ov.hidden=false;$('snakeOverlayTitle').textContent=snake.status==='won'?'Every dot.':'One more?';$('snakeStart').textContent='Play again'}}"""
          new_draw="""function drawSnake(){if(!sW)return;const{cell,ox,oy}=snakeGeom(),c=snakePalette(),size=snakeSizeFactor(),now=performance.now();sctx.clearRect(0,0,sW,sH);for(let y=0;y<snake.rows;y++)for(let x=0;x<snake.cols;x++)dot(sctx,ox+(x+.5)*cell,oy+(y+.5)*cell,Math.max(1.15,cell*.065),'#dfe6f5',.72);if(snake.food){const fx=ox+(snake.food.x+.5)*cell,fy=oy+(snake.food.y+.5)*cell;snakeMark(sctx,fx,fy,cell*.27,c.food);dot(sctx,fx,fy,cell*.07,'#fff',.92)}drawSnakeBooster(cell,ox,oy,now);const a=snake.status==='playing'?Math.min(1,snake.elapsed/snake.speed()):1;const points=snake.snake.map((p,i)=>snakeRenderPoint(p,snake.prev[i]||p,a));for(let i=points.length-1;i>=1;i--){const p=points[i],fade=1-Math.min(.22,i/Math.max(1,points.length-1)*.22);snakeMark(sctx,ox+(p.x+.5)*cell,oy+(p.y+.5)*cell,cell*.255*size,c.body,fade)}if(points[0])drawSnakeHead(ox+(points[0].x+.5)*cell,oy+(points[0].y+.5)*cell,cell);$('snakeScore').textContent=snake.score;if(snake.status==='over'||snake.status==='won'){const ov=$('snakeOverlay');ov.hidden=false;$('snakeOverlayTitle').textContent=snake.status==='won'?'Every dot.':'One more?';$('snakeStart').textContent='Play again'}}"""
          if old_draw not in s: raise SystemExit('Snake draw block not found')
          s=s.replace(old_draw,new_draw,1)

          old_start_fn="""function startSnake(){snake.reset(snake.cols,snake.rows);snake.start();$('snakeOverlay').hidden=true;$('snakeStart').textContent='Play';beep(480)}"""
          new_start_fn="""function startSnake(){snake.reset(snake.cols,snake.rows);snake.start();snakeBooster=null;snakeEffect=null;scheduleSnakeBooster();$('snakeOverlay').hidden=true;$('snakeStart').textContent='Play';beep(480)}"""
          if old_start_fn not in s: raise SystemExit('Snake start function not found')
          s=s.replace(old_start_fn,new_start_fn,1)

          old_frame="""function frame(t){const ds=sLast?Math.min(50,t-sLast):0,dt=tLast?Math.min(50,t-tLast):0;sLast=t;tLast=t;if(currentPage==='snake'&&snake.status==='playing')snake.tick(ds);if(currentPage==='tetris'&&tetris.status==='playing')tetris.tick(dt);if(currentPage==='snake')drawSnake();if(currentPage==='tetris')drawTetris();requestAnimationFrame(frame)}"""
          new_frame="""function frame(t){const ds=sLast?Math.min(50,t-sLast):0,dt=tLast?Math.min(50,t-tLast):0;sLast=t;tLast=t;if(currentPage==='snake'&&snake.status==='playing'){snake.tick(ds*snakeSpeedFactor(t));updateSnakeBoosters(t)}if(currentPage==='tetris'&&tetris.status==='playing')tetris.tick(dt);if(currentPage==='snake')drawSnake();if(currentPage==='tetris')drawTetris();requestAnimationFrame(frame)}"""
          if old_frame not in s: raise SystemExit('Frame function not found')
          s=s.replace(old_frame,new_frame,1)

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make Snake fullscreen with themes shapes and boosters'
          git push
