name: Apply Words bottom wheel

on:
  push:
    paths:
      - 'scripts/patch_words_bottom_wheel.py'
      - '.github/workflows/run-words-bottom-wheel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Words layout
        run: python3 scripts/patch_words_bottom_wheel.py
      - name: Validate
        run: |
          grep -q "keep wheel anchored at bottom" index.html
          grep -q "#wordsPage .word-targets{flex:1 1 auto" index.html
          grep -q "#wordsPage .word-wheel-wrap{flex:0 0 auto" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Keep Words wheel anchored at bottom"
          git push
