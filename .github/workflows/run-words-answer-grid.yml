name: Apply Words answer grid

on:
  push:
    paths:
      - 'scripts/patch_words_answer_grid.py'
      - '.github/workflows/run-words-answer-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Words answer layout
        run: python3 scripts/patch_words_answer_grid.py
      - name: Validate
        run: |
          grep -q "grid-template-columns:repeat(2,max-content)" index.html
          grep -q "margin:0}" index.html
          grep -q -- "--wheel:min(375px,40dvh" index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use responsive grid for Words answers"
          git push
