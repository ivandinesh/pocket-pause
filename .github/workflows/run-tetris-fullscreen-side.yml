name: Apply Tetris full-screen side layout

on:
  push:
    paths:
      - 'scripts/patch_tetris_fullscreen_side.py'
      - '.github/workflows/run-tetris-fullscreen-side.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tetris layout
        run: python3 scripts/patch_tetris_fullscreen_side.py
      - name: Validate
        run: |
          grep -Fq 'class="tetris-layout"' index.html
          grep -Fq 'class="tetris-side"' index.html
          grep -Fq 'function renderTetrisNext()' index.html
          grep -Fq 'body:has(#tetrisPage.active) .topbar{display:none}' index.html
      - name: Commit patched app
        run: |
          git config user.name "Dinesh"
          git config user.email "din.frndxp@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Redesign Tetris as full-screen split layout"
          git push
