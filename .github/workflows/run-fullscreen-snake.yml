name: Apply fullscreen Snake

on:
  push:
    paths:
      - '.github/workflows/run-fullscreen-snake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Snake patch
        run: |
          sed -i "s/snakeEffect.type==='slow'?.68:1/snakeEffect.type==='slow' ? .68 : 1/" scripts/patch_fullscreen_snake.py
          python3 scripts/patch_fullscreen_snake.py
      - name: Validate generated JavaScript markers
        run: |
          grep -q "Snake-only true full-screen playfield" index.html
          grep -q "data-snake-shape=\"square\"" index.html
          grep -q "function updateSnakeBoosters" index.html
          grep -q "snakeEffect.type==='slow' ? .68 : 1" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make Snake fullscreen with themes shapes and boosters'
          git push
