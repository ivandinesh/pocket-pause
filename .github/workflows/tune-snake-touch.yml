name: Tune Snake touch

on:
  push:
    paths:
      - '.github/workflows/tune-snake-touch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine held-finger steering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function handleSnakeGestureMove(x,y){if(!sGesture)return;const dx=x-sGesture.x,dy=y-sGesture.y,dist=Math.max(Math.abs(dx),Math.abs(dy));if(dist<8)return;const dir=snakeGestureDir(dx,dy),next=DIRS[dir],current=snake.queue.at(-1)||snake.dir;if(next&&dir!==sGesture.lastDir&&!(next.x===-current.x&&next.y===-current.y)){steerSnake(dir);sGesture.lastDir=dir}sGesture.x=x;sGesture.y=y;if(dir===sGesture.lastDir)sGesture.lastDir=null}"
          new="function handleSnakeGestureMove(x,y){if(!sGesture)return;const dx=x-sGesture.x,dy=y-sGesture.y,dist=Math.max(Math.abs(dx),Math.abs(dy));if(dist<8)return;const dir=snakeGestureDir(dx,dy),next=DIRS[dir],current=snake.queue.at(-1)||snake.dir;if(next&&!(next.x===-current.x&&next.y===-current.y)&&(next.x!==current.x||next.y!==current.y))steerSnake(dir);sGesture.x=x;sGesture.y=y}"
          if old not in s:
              raise SystemExit('Expected Snake gesture source not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine held-finger Snake steering'
          git push
